<div class="contact-container">

<form action="https://formspree.io/f/yourformid" method="POST">
    
<div class="form-group">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Eliose Ramos">
</div>

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="elioseramose@email.com">
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" placeholder="(808) 555-1234">
</div>

<div class="form-group">
<label for="subject">Subject</label>
<input type="text" id="subject" name="subject" placeholder="Custom engraving request">
</div>

<div class="form-group">
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" placeholder="Describe the item and engraving you would like."></textarea>
</div>

<div class="form-button">
<button type="submit">Send Message</button>
</div>

</form>

</div>
