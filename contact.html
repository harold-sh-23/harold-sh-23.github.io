<div class="contact-container">

<form action="mailto:eloise_ramos@yahoo.com" method="post" enctype="text/plain" autocomplete="on">

<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="John Smith" autocomplete="name">

<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="johnsmith@email.com" autocomplete="email">

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" placeholder="(808) 555-1234" autocomplete="tel">

<label for="subject">Subject</label>
<input type="text" id="subject" name="subject" placeholder="Custom Engraving Request">

<label for="message">Message</label>
<textarea id="message" name="message" rows="6" placeholder="Please describe the item you would like engraved, quantity, and any special design requests." autocomplete="off"></textarea>

<button type="submit">Send Message</button>

</form>
